<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مدير المجموعات والدرجات - نظام التبويبات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Tajawal', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0f0 0%, #bdd0e6 100%);
            min-height: 100vh;
            padding: 30px 24px 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الحاوية الرئيسية */
        .dashboard {
            max-width: 1500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            border-radius: 64px;
            padding: 20px 28px 32px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        /* تبويبات */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #ecf3fa;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #1e3c5c;
            box-shadow: 0 5px 0 #8fa6c2;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: #2c5a7a;
            color: white;
            box-shadow: 0 3px 0 #0e2a3e;
            transform: translateY(2px);
        }

        .tab-btn:hover:not(.active) {
            background: #cbddee;
            transform: translateY(-1px);
            box-shadow: 0 4px 0 #7f96b0;
        }

        /* محتوى التبويبات */
        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-content.active-tab {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* تخطيط الجدولين جنباً إلى جنب */
        .tables-row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
            margin: 20px 0 25px;
        }

        .card-table {
            flex: 1;
            min-width: 280px;
            background: #fefef7;
            border-radius: 40px;
            padding: 20px 20px 25px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .card-table h3 {
            font-size: 1.5rem;
            color: #1e4663;
            border-right: 6px solid #2c7da0;
            padding-right: 16px;
            margin-bottom: 20px;
        }

        /* الجداول */
        .students-table, .grade-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .students-table th, .students-table td,
        .grade-table th, .grade-table td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .students-table th, .grade-table th {
            background-color: #eef2f8;
            color: #1f486b;
            font-weight: bold;
        }

        .students-table tr:last-child td,
        .grade-table tr:last-child td {
            border-bottom: none;
        }

        /* قائمة منسدلة داخل الجدول */
        .student-select {
            width: 100%;
            padding: 8px 6px;
            border-radius: 60px;
            border: 1px solid #b9cdE5;
            background-color: #fff;
            font-weight: 500;
        }

        .grade-input {
            width: 100%;
            padding: 8px 8px;
            border-radius: 32px;
            border: 1px solid #b9cde5;
            text-align: center;
            font-size: 1rem;
        }

        /* أزرار ثلاثية الأبعاد */
        .btn-3d {
            background: #2b6e4f;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 6px 0 #1a3e2f;
            transform: translateY(-2px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1a3e2f;
        }

        .add-student-btn {
            background: #3a6ea5;
            box-shadow: 0 6px 0 #26466d;
        }

        .assign-btn {
            background: #e09132;
            box-shadow: 0 6px 0 #a55f1a;
            margin-top: 10px;
            width: 100%;
        }

        .add-grade-all {
            background: #3c8f6e;
            box-shadow: 0 6px 0 #235b44;
            margin-top: 20px;
            width: auto;
            padding: 12px 30px;
        }

        .group-actions {
            display: flex;
            justify-content: flex-start;
            margin-top: 10px;
        }

        /* نموذج اضافة اسم */
        .add-name-form {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-name-form input {
            flex: 3;
            min-width: 180px;
            padding: 12px 18px;
            border-radius: 60px;
            border: none;
            background: #ffffffdd;
            border: 1px solid #cbdbe2;
            font-size: 1rem;
        }

        /* تبويب النتائج */
        .results-container {
            background: #fef9ef;
            border-radius: 48px;
            padding: 20px 28px;
        }

        .group-result {
            background: white;
            margin-bottom: 18px;
            border-radius: 40px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            border-right: 12px solid #2c7da0;
        }

        .group-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1f4e6e;
        }

        .total-score {
            background: #e9f0f5;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1b5e3f;
        }

        hr {
            margin: 16px 0;
        }

        /* رسوم متجاوبة */
        @media (max-width: 850px) {
            .tables-row {
                flex-direction: column;
            }
            .dashboard {
                padding: 16px;
            }
            .tab-btn {
                padding: 8px 18px;
                font-size: 0.9rem;
            }
        }

        .small-note {
            font-size: 0.8rem;
            color: #476b8a;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- تبويبات رئيسية: 7 مجموعات + النتائج -->
    <div class="tabs" id="tabsContainer"></div>

    <!-- محتويات التبويبات السبعة -->
    <div id="groupsContainer"></div>

    <!-- تبويب النتائج (سيتم عرضه عند الضغط) -->
    <div id="resultsTabContent" class="tab-content"></div>
</div>

<script>
    // ------------------- أسماء المجموعات -------------------
    const GROUP_NAMES = [
        "المجموعة الاولى",
        "المجموعة الثانية",
        "المجموعة الثالثة",
        "المجموعة الرابعة",
        "المجموعة الخامسة",
        "المجموعة السادسة",
        "المجموعة السابعة"
    ];
    const TOTAL_GROUPS = 7;

    // هيكل البيانات: لكل مجموعة قائمة طلاب [{ id, name, grade }]
    // grade: رقم (قد يكون null أو الرقم المضاف)
    // ونسخة احتياطية من الدرجات الفردية حسب ما يضيفه المعلم لكل طالب على حدة (نفس grade)
    // لكن لسهولة، سنخزن مباشرة في الطالب حقل grade (يبدأ null ثم يحدد بالدرجة اليدوية او اضافة للجميع)
    let groupsData = [];

    // مفتاح التخزين المحلي
    const STORAGE_KEY = "TeacherGroupsSystemV1";

    // تهيئة البيانات أو تحميل من localStorage
    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length === TOTAL_GROUPS) {
                    groupsData = parsed;
                    return;
                }
            } catch(e) {}
        }
        // بيانات افتراضية (فارغة)
        groupsData = [];
        for (let i = 0; i < TOTAL_GROUPS; i++) {
            groupsData.push({
                groupIndex: i,
                students: []     // كل طالب: { id, name, grade }
            });
        }
        // إضافة بعض الطلاب تجريبيين للتوضيح (اختياري ليسهل رؤية الشكل)
        if(!saved){
            // نموذج مجموعة 0
            groupsData[0].students.push({ id: Date.now()+1, name: "محمد احمد", grade: null });
            groupsData[0].students.push({ id: Date.now()+2, name: "خالد علي", grade: null });
            groupsData[1].students.push({ id: Date.now()+3, name: "سارة يوسف", grade: null });
        }
        saveToLocal();
    }

    function saveToLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(groupsData));
    }

    // إضافة طالب لمجموعة معينة
    function addStudentToGroup(groupIdx, studentName) {
        if (!studentName || studentName.trim() === "") return false;
        const newName = studentName.trim();
        const newId = Date.now() + Math.random() * 10000;
        groupsData[groupIdx].students.push({
            id: newId,
            name: newName,
            grade: null
        });
        saveToLocal();
        renderAllTabsContent();     // تحديث المحتوى بالكامل مع الحفاظ على التبويب النشط
        return true;
    }

    // إضافة درجة لطالب معين في مجموعة (يدوياً عبر الجدول الثاني)
    function assignGradeToStudent(groupIdx, studentId, gradeValue) {
        const students = groupsData[groupIdx].students;
        const student = students.find(s => s.id == studentId);
        if (student) {
            let numericGrade = parseFloat(gradeValue);
            if (isNaN(numericGrade)) numericGrade = null;
            else numericGrade = Math.min(100, Math.max(0, numericGrade)); // نطاق 0-100
            student.grade = numericGrade;
            saveToLocal();
            renderAllTabsContent();
        }
    }

    // اضافة درجة للجميع في مجموعة معينة (كل الطلاب المضافين في هذا التبويب)
    function addGradeToAllInGroup(groupIdx, gradeValue) {
        let numericGrade = parseFloat(gradeValue);
        if (isNaN(numericGrade)) numericGrade = null;
        else numericGrade = Math.min(100, Math.max(0, numericGrade));
        const students = groupsData[groupIdx].students;
        if (students.length === 0) return;
        for (let student of students) {
            student.grade = numericGrade;
        }
        saveToLocal();
        renderAllTabsContent();
    }

    // حساب مجموع الدرجات للمجموعة (مجموع الدرجات الفعلية، تجاهل null)
    function getTotalScoreForGroup(groupIdx) {
        const students = groupsData[groupIdx].students;
        let total = 0;
        for (let s of students) {
            if (s.grade !== null && !isNaN(s.grade)) {
                total += s.grade;
            }
        }
        return total;
    }

    // ============= بناء التبويبات والجداول ديناميكيا =============
    let currentActiveTab = 0;   // 0..6 للمجموعات, 7 للنتائج

    function renderTabs() {
        const tabsContainer = document.getElementById("tabsContainer");
        tabsContainer.innerHTML = "";
        // تبويبات المجموعات
        for (let i = 0; i < TOTAL_GROUPS; i++) {
            const btn = document.createElement("button");
            btn.className = "tab-btn";
            if (currentActiveTab === i) btn.classList.add("active");
            btn.textContent = GROUP_NAMES[i];
            btn.addEventListener("click", (function(idx) {
                return function() { switchToTab(idx); };
            })(i));
            tabsContainer.appendChild(btn);
        }
        // تبويب النتائج
        const resultsBtn = document.createElement("button");
        resultsBtn.className = "tab-btn";
        if (currentActiveTab === TOTAL_GROUPS) resultsBtn.classList.add("active");
        resultsBtn.textContent = "النتائج";
        resultsBtn.addEventListener("click", () => switchToTab(TOTAL_GROUPS));
        tabsContainer.appendChild(resultsBtn);
    }

    // تبديل التبويب
    function switchToTab(tabIndex) {
        currentActiveTab = tabIndex;
        renderTabs();
        // اخفاء كل المحتويات
        const groupsContainer = document.getElementById("groupsContainer");
        const resultsContainer = document.getElementById("resultsTabContent");
        groupsContainer.style.display = (tabIndex < TOTAL_GROUPS) ? "block" : "none";
        resultsContainer.style.display = (tabIndex === TOTAL_GROUPS) ? "block" : "none";

        if (tabIndex < TOTAL_GROUPS) {
            renderGroupTabContent(tabIndex);
        } else {
            renderResultsTab();
        }
    }

    // عرض محتوى تبويب مجموعة معينة (الجدولين جنباً إلى جنب)
    function renderGroupTabContent(groupIdx) {
        const container = document.getElementById("groupsContainer");
        container.innerHTML = ""; 
        const group = groupsData[groupIdx];
        const students = group.students;

        // حاوية رئيسية
        const wrapper = document.createElement("div");
        wrapper.className = "active-tab";

        // نموذج اضافة اسم
        const addForm = document.createElement("div");
        addForm.className = "add-name-form";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.placeholder = "اسم الطالب ...";
        nameInput.dir = "rtl";
        const addBtn = document.createElement("button");
        addBtn.textContent = "+ إضافة اسم";
        addBtn.className = "btn-3d add-student-btn";
        addBtn.addEventListener("click", () => {
            const val = nameInput.value.trim();
            if (val === "") {
                alert("الرجاء إدخال اسم الطالب");
                return;
            }
            addStudentToGroup(groupIdx, val);
            nameInput.value = "";
        });
        addForm.appendChild(nameInput);
        addForm.appendChild(addBtn);
        wrapper.appendChild(addForm);

        // القسم الرئيسي: جدولين جنباً
        const tablesRow = document.createElement("div");
        tablesRow.className = "tables-row";

        // الجدول الأول: قائمة الطلاب والدرجات
        const leftCard = document.createElement("div");
        leftCard.className = "card-table";
        leftCard.innerHTML = `<h3>📋 قائمة الطلاب والدرجات</h3>`;
        const studentTable = document.createElement("table");
        studentTable.className = "students-table";
        let thead = `<thead><tr><th>#</th><th>اسم الطالب</th><th>الدرجة 🟢</th></tr></thead><tbody>`;
        let tbody = "";
        if (students.length === 0) {
            tbody = `<tr><td colspan="3" style="text-align:center;">لا يوجد طلاب، أضف طلاباً أولاً</td></tr>`;
        } else {
            students.forEach((stu, idx) => {
                const displayGrade = (stu.grade !== null && !isNaN(stu.grade)) ? stu.grade : "—";
                tbody += `<tr>
                    <td>${idx+1}</td>
                    <td>${escapeHtml(stu.name)}</td>
                    <td>${displayGrade}</td>
                </tr>`;
            });
        }
        studentTable.innerHTML = thead + tbody + `</tbody>`;
        leftCard.appendChild(studentTable);
        tablesRow.appendChild(leftCard);

        // الجدول الثاني: قائمة منسدلة للطلاب + عمود الدرجة اليدوي
        const rightCard = document.createElement("div");
        rightCard.className = "card-table";
        rightCard.innerHTML = `<h3>✏️ إضافة/تعديل درجة لطالب</h3>`;
        const gradeAssignTable = document.createElement("table");
        gradeAssignTable.className = "grade-table";
        gradeAssignTable.innerHTML = `
            <thead><tr><th>اختر الطالب</th><th>الدرجة (0-100)</th><th></th></tr></thead>
            <tbody id="gradeAssignBody-${groupIdx}"></tbody>
        `;
        rightCard.appendChild(gradeAssignTable);
        
        // حاوية الصفوف ديناميكية (يمكن أن يكون هناك عدة إجراءات لكننا نعرض صفاً واحداً لإضافة درجة لطالب محدد؟ بناء على الصورة المرفقة: يوجد جدول به عمود اختيار الطالب وعمود درجة وزر إضافة درجة)
        // حسب الوصف: "جدول يحتوي على عمودين فقط: عمود لاختيار الطالب المضاف (قائمة منسدلة) وعمود بالدرجة يضيفها المعلم يدويا" 
        // نوفر صفاً واحداً يتضمن اختيار الطالب وحقل الدرجة وزر "تعيين الدرجة"
        const tbodyAssign = document.createElement("tbody");
        const row = document.createElement("tr");
        
        const selectCell = document.createElement("td");
        const selectEl = document.createElement("select");
        selectEl.className = "student-select";
        selectEl.id = `studentSelect-${groupIdx}`;
        if (students.length === 0) {
            const opt = document.createElement("option");
            opt.textContent = "لا يوجد طلاب";
            opt.disabled = true;
            selectEl.appendChild(opt);
        } else {
            students.forEach(stu => {
                const option = document.createElement("option");
                option.value = stu.id;
                option.textContent = stu.name;
                selectEl.appendChild(option);
            });
        }
        selectCell.appendChild(selectEl);
        
        const gradeCell = document.createElement("td");
        const gradeInput = document.createElement("input");
        gradeInput.type = "number";
        gradeInput.placeholder = "الدرجة";
        gradeInput.className = "grade-input";
        gradeInput.step = "0.5";
        gradeInput.min = "0";
        gradeInput.max = "100";
        gradeCell.appendChild(gradeInput);
        
        const actionCell = document.createElement("td");
        const assignBtn = document.createElement("button");
        assignBtn.textContent = "تعيين";
        assignBtn.className = "btn-3d assign-btn";
        assignBtn.style.padding = "6px 18px";
        assignBtn.addEventListener("click", () => {
            const selectedId = selectEl.value;
            if (!selectedId || students.length === 0) return alert("لا يوجد طلاب");
            const rawGrade = gradeInput.value;
            if (rawGrade === "") return alert("أدخل درجة");
            assignGradeToStudent(groupIdx, selectedId, rawGrade);
            gradeInput.value = "";
        });
        actionCell.appendChild(assignBtn);
        
        row.appendChild(selectCell);
        row.appendChild(gradeCell);
        row.appendChild(actionCell);
        tbodyAssign.appendChild(row);
        gradeAssignTable.appendChild(tbodyAssign);
        
        // إضافة جدول الدرجة كامل
        rightCard.appendChild(gradeAssignTable);
        tablesRow.appendChild(rightCard);
        wrapper.appendChild(tablesRow);
        
        // زر اضافة درجة للجميع (أسفل الجدولين كما هو مطلوب)
        const allGradeDiv = document.createElement("div");
        allGradeDiv.className = "group-actions";
        const allGradeInput = document.createElement("input");
        allGradeInput.type = "number";
        allGradeInput.placeholder = "الدرجة للجميع (0-100)";
        allGradeInput.style.padding = "10px 14px";
        allGradeInput.style.borderRadius = "60px";
        allGradeInput.style.border = "1px solid #ccc";
        allGradeInput.style.marginLeft = "12px";
        allGradeInput.style.width = "160px";
        const allBtn = document.createElement("button");
        allBtn.textContent = "➕ إضافة درجة للجميع";
        allBtn.className = "btn-3d add-grade-all";
        allBtn.addEventListener("click", () => {
            const gradeVal = allGradeInput.value;
            if (gradeVal === "") {
                alert("أدخل درجة لإضافتها لجميع الطلاب في هذه المجموعة");
                return;
            }
            addGradeToAllInGroup(groupIdx, gradeVal);
            allGradeInput.value = "";
        });
        allGradeDiv.appendChild(allGradeInput);
        allGradeDiv.appendChild(allBtn);
        wrapper.appendChild(allGradeDiv);
        
        container.appendChild(wrapper);
    }

    // عرض تبويب النتائج: المجموعات السبعة مع مجموع الدرجات
    function renderResultsTab() {
        const resultsDiv = document.getElementById("resultsTabContent");
        resultsDiv.innerHTML = "";
        const container = document.createElement("div");
        container.className = "results-container";
        container.innerHTML = `<h2 style="color:#1f4e6e; margin-bottom:24px;">📊 ملخص النتائج حسب المجموعة</h2>`;
        
        for (let i = 0; i < TOTAL_GROUPS; i++) {
            const totalScore = getTotalScoreForGroup(i);
            const groupDiv = document.createElement("div");
            groupDiv.className = "group-result";
            groupDiv.innerHTML = `
                <span class="group-name">${GROUP_NAMES[i]}</span>
                <span class="total-score">المجموع: ${totalScore}  نقطة</span>
            `;
            container.appendChild(groupDiv);
        }
        const footerNote = document.createElement("div");
        footerNote.className = "small-note";
        footerNote.style.marginTop = "24px";
        footerNote.style.textAlign = "center";
        footerNote.innerText = "✅ يتم الحفظ التلقائي لكل التعديلات (إضافة طلاب، درجات) تلقائياً.";
        container.appendChild(footerNote);
        resultsDiv.appendChild(container);
    }

    // إعادة عرض جميع المحتويات بناءً على currentActiveTab
    function renderAllTabsContent() {
        renderTabs();
        const groupsContainer = document.getElementById("groupsContainer");
        const resultsContainer = document.getElementById("resultsTabContent");
        if (currentActiveTab < TOTAL_GROUPS) {
            groupsContainer.style.display = "block";
            resultsContainer.style.display = "none";
            renderGroupTabContent(currentActiveTab);
        } else {
            groupsContainer.style.display = "none";
            resultsContainer.style.display = "block";
            renderResultsTab();
        }
    }

    // مساعد html escaping بسيط
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // تهيئة الصفحة بالكامل
    function init() {
        loadData();
        // إنشاء حاويات ديناميكية
        const groupsContainerDiv = document.createElement("div");
        groupsContainerDiv.id = "groupsContainer";
        groupsContainerDiv.style.display = "block";
        const resultsDiv = document.createElement("div");
        resultsDiv.id = "resultsTabContent";
        resultsDiv.style.display = "none";
        document.querySelector(".dashboard").appendChild(groupsContainerDiv);
        document.querySelector(".dashboard").appendChild(resultsDiv);
        
        // ضبط التبويب الافتراضي (المجموعة الاولى)
        currentActiveTab = 0;
        renderTabs();
        // عرض المحتوى الأول
        groupsContainerDiv.style.display = "block";
        resultsDiv.style.display = "none";
        renderGroupTabContent(0);
        
        // إضافة مستمع للأحداث لا حاجة، كل شيء يعاد رسمه
    }
    
    init();
</script>
</body>
</html>
